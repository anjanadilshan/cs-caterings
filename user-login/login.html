<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17211d">
    <title>Account | CS Catering</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="login-layout">
        <a class="brand" href="../CS.html" aria-label="CS Catering home">CS <span>CATERING</span></a>
        <section class="login-card" aria-labelledby="page-title">
            <a class="back-link" href="../CS.html">← Back to website</a>
            <p class="eyebrow">CS CATERING ACCOUNT</p>
            <h1 id="page-title">Welcome</h1>
            <p class="intro">Login or register to continue.</p>

            <div class="tabs" role="tablist" aria-label="Account options">
                <button class="tab active" id="signin-tab" type="button" role="tab" aria-selected="true">Login</button>
                <button class="tab" id="signup-tab" type="button" role="tab" aria-selected="false">Register</button>
            </div>

            <form id="account-form">
                <label id="name-label" class="hidden" for="full-name">Full name</label>
                <input id="full-name" class="hidden" type="text" autocomplete="name" minlength="2" placeholder="Your name">

                <label id="phone-label" class="hidden" for="phone-number">Contact number</label>
                <input id="phone-number" class="hidden" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" pattern="[\d+ .\-]{7,20}" placeholder="e.g. +94 77 123 4567" title="Enter 7 to 20 characters using digits, spaces, +, dots, or hyphens">

                <label id="address-label" class="hidden" for="address">Delivery address</label>
                <textarea id="address" class="hidden" autocomplete="street-address" rows="3" placeholder="Street, area, city"></textarea>

                <label for="email">Email address</label>
                <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">

                <button id="submit-button" class="submit-button" type="submit">Login</button>
            </form>

            <p id="message" class="message" role="status" aria-live="polite"></p>
            <section id="signed-in-panel" class="signed-in-panel hidden" aria-live="polite">
                <p class="signed-in-heading">Your account</p>
                <p class="account-email">Email: <strong id="signed-in-email"></strong></p>
                <form id="profile-form">
                    <label for="profile-name">Full name</label>
                    <input id="profile-name" type="text" autocomplete="name" minlength="2" required>

                    <label for="profile-phone">Contact number</label>
                    <input id="profile-phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" pattern="[+0-9() .-]{7,20}" required title="Enter 7 to 20 characters using digits, spaces, +, parentheses, dots, or hyphens">

                    <label for="profile-address">Delivery address</label>
                    <textarea id="profile-address" autocomplete="street-address" rows="3"></textarea>

                    <button id="save-profile-button" class="submit-button" type="submit">Save changes</button>
                </form>
                <p id="profile-message" class="message" role="status" aria-live="polite"></p>
                <a id="continue-button" class="continue-button" href="../CS.html">Continue to website</a>
                <button id="signout-button" class="secondary-button" type="button">Sign out</button>
            </section>
            <p class="privacy-note">Your account is managed securely by Supabase Authentication.</p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
