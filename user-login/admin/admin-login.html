<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | CS Catering</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-page">
    <header>
        <nav class="header-container">
            <a class="company-name admin-brand" href="../../index.html">CS <span class="accent">CATERING</span></a>
            <div class="admin-nav-links">
                <a class="nav-btn" href="../../menu.html">Rental items</a>
                <a class="nav-btn" href="../../store.html">Cleaning store</a>
            </div>
        </nav>
    </header>

    <main class="admin-shell">
        <div class="admin-heading">
            <div>
                <p class="admin-eyebrow">CATALOG MANAGEMENT</p>
                <h1 id="auth-title">Admin Login</h1>
                <p id="auth-description">Sign in with an approved administrator account.</p>
            </div>
        </div>
        <section class="admin-panel auth-panel">
            <nav class="admin-auth-tabs" role="tablist" aria-label="Admin account options">
                <button id="login-tab" class="admin-auth-tab active" type="button" role="tab" aria-selected="true">Login</button>
                <button id="register-tab" class="admin-auth-tab" type="button" role="tab" aria-selected="false">Register</button>
            </nav>
            <form id="admin-login-form" class="admin-form">
                <label for="admin-email">Email</label>
                <input id="admin-email" type="email" autocomplete="username" required>
                <label for="admin-password">Password</label>
                <input id="admin-password" type="password" autocomplete="current-password" required>
                <button id="login-button" class="admin-primary" type="submit">Sign in</button>
            </form>
            <form id="admin-register-form" class="admin-form hidden">
                <label for="admin-name">Full name</label>
                <input id="admin-name" type="text" autocomplete="name" minlength="2" required>
                <label for="admin-register-email">Email</label>
                <input id="admin-register-email" type="email" autocomplete="email" required>
                <label for="admin-register-password">Password</label>
                <input id="admin-register-password" type="password" autocomplete="new-password" minlength="6" required>
                <button id="register-button" class="admin-primary" type="submit">Register</button>
            </form>
            <p id="admin-login-status" class="admin-status" role="status" aria-live="polite"></p>
            <p id="approval-note" class="approval-note hidden">Registration does not grant dashboard access. An existing administrator must approve the account.</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../supabase-client.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
